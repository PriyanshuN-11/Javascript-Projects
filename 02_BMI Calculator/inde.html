<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css" ></link>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p> <lable>Height(cm) : </lable> <input type="text" id="height"/></p>
            <p> <lable>Weight(kg) : </lable> <input type="text" id="weight"/></p>
            <button >calculate BMI</button>
            <div class="results"></div>
            <div class="BMi-guide">
                <h2>BMI Guide</h2>
                <p>less than 18.6 : Underweight</p>
                <p>18.6 - 24.9 : Normal weight</p>
                <p>Greater than 24.9 : Overweight</p>
            </div>
        </form>
    </div>
    
</body>
<script src="script.js"></script>
</html>
